<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian with warm inner gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Glowing Rim Border -->
    <linearGradient id="fav-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Solar Flame Gradient -->
    <linearGradient id="fav-flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Inner Core Diamond -->
    <linearGradient id="fav-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EA580C" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Shield Base -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#fav-rim)" stroke-width="2" />

  <!-- Radial Core Glow -->
  <circle cx="32" cy="34" r="18" fill="#EA580C" opacity="0.35" filter="blur(6px)" />

  <!-- Main Emblem Artwork -->
  <g filter="url(#fav-glow)">
    <!-- Polished Serving Cloche Base -->
    <path
      d="M14 43.5C20 47.5 44 47.5 50 43.5C47.5 45.5 16.5 45.5 14 43.5Z"
      fill="#FFFFFF"
      opacity="0.95"
    />
    <path
      d="M16 39.5C21.5 43.5 42.5 43.5 48 39.5C45.5 41.5 18.5 41.5 16 39.5Z"
      fill="url(#fav-flame)"
      opacity="0.9"
    />

    <!-- Dynamic 3-Tier Culinary Flame & Crown -->
    <!-- Left Wing -->
    <path
      d="M24 36C22 33 21 28 23 23C25 27 27 29 27 33C27 34.5 26 35.5 24 36Z"
      fill="#F59E0B"
      opacity="0.95"
    />
    <!-- Right Wing -->
    <path
      d="M40 36C42 33 43 28 41 23C39 27 37 29 37 33C37 34.5 38 35.5 40 36Z"
      fill="#F59E0B"
      opacity="0.95"
    />
    <!-- Center Main Torch Flame -->
    <path
      d="M32 11C32 11 38 18 38 26C38 32.5 35 37 32 37C29 37 26 32.5 26 26C26 18 32 11 32 11Z"
      fill="url(#fav-flame)"
    />

    <!-- Central Radiant Diamond Spark / Intelligence Core -->
    <path
      d="M32 22L34.5 27L32 32L29.5 27L32 22Z"
      fill="url(#fav-core)"
    />

    <!-- Top Sparkle Star -->
    <circle cx="32" cy="11.5" r="1.5" fill="#FFFFFF" />
    <path
      d="M44 15L45.2 17.5L48 18.5L45.2 19.5L44 22L42.8 19.5L40 18.5L42.8 17.5L44 15Z"
      fill="#FDE047"
    />
  </g>
</svg>
