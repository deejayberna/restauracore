<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <!-- Obsidian Shield Gradient -->
    <linearGradient id="logo-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Solar Rim Gradient -->
    <linearGradient id="logo-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Solar Flame Gradient -->
    <linearGradient id="logo-flame-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Text Orange Gradient -->
    <linearGradient id="logo-text-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="logo-glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#EA580C" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (52x52 at x=6, y=6) -->
  <g transform="translate(6, 6)">
    <!-- Dark Shield Base -->
    <rect width="52" height="52" rx="14" fill="url(#logo-bg-light)" />
    <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="13.25" stroke="url(#logo-rim-light)" stroke-width="1.5" />

    <!-- Internal Radiant Flare -->
    <circle cx="26" cy="28" r="14" fill="#EA580C" opacity="0.3" filter="blur(5px)" />

    <!-- Main Emblem Scaled -->
    <g transform="translate(26, 26) scale(0.78) translate(-32, -32)" filter="url(#logo-glow-light)">
      <!-- Cloche Base -->
      <path d="M14 43.5C20 47.5 44 47.5 50 43.5C47.5 45.5 16.5 45.5 14 43.5Z" fill="#FFFFFF" opacity="0.95" />
      <path d="M16 39.5C21.5 43.5 42.5 43.5 48 39.5C45.5 41.5 18.5 41.5 16 39.5Z" fill="url(#logo-flame-light)" opacity="0.9" />

      <!-- 3-Tier Flame Crown -->
      <path d="M24 36C22 33 21 28 23 23C25 27 27 29 27 33C27 34.5 26 35.5 24 36Z" fill="#F59E0B" opacity="0.95" />
      <path d="M40 36C42 33 43 28 41 23C39 27 37 29 37 33C37 34.5 38 35.5 40 36Z" fill="#F59E0B" opacity="0.95" />
      <path d="M32 11C32 11 38 18 38 26C38 32.5 35 37 32 37C29 37 26 32.5 26 26C26 18 32 11 32 11Z" fill="url(#logo-flame-light)" />

      <!-- Core Diamond -->
      <path d="M32 22L34.5 27L32 32L29.5 27L32 22Z" fill="#FFFFFF" />
      
      <!-- Sparkle -->
      <circle cx="32" cy="11.5" r="1.5" fill="#FFFFFF" />
      <path d="M44 15L45.2 17.5L48 18.5L45.2 19.5L44 22L42.8 19.5L40 18.5L42.8 17.5L44 15Z" fill="#FDE047" />
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(70, 14)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.03em" fill="#0F172A">
      Restaura<tspan fill="url(#logo-text-orange)">Core</tspan>
    </text>

    <!-- PRO Badge -->
    <g transform="translate(178, 9)">
      <rect width="36" height="18" rx="5" fill="#0F172A" />
      <rect x="0.5" y="0.5" width="35" height="17" rx="4.5" stroke="#F59E0B" stroke-width="1" />
      <text x="18" y="12.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.08em" fill="#FDE68A" text-anchor="middle">PRO</text>
    </g>

    <!-- Subtitle Tagline -->
    <text x="1" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.16em" fill="#64748B" text-transform="uppercase">
      SISTEMA INTEGRAL PARA RESTAURANTES
    </text>
  </g>
</svg>

