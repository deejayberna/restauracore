<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="rc-horiz-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="55%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Flame Highlight -->
    <linearGradient id="rc-horiz-flame-dark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>

    <!-- Core Glow -->
    <linearGradient id="rc-horiz-core-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Text Orange Gradient -->
    <linearGradient id="rc-text-orange-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="rc-horiz-shadow-dark" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (50x50 at x=4, y=5) -->
  <g transform="translate(4, 5)">
    <rect width="50" height="50" rx="13" fill="url(#rc-horiz-bg-dark)" />
    <rect x="0.75" y="0.75" width="48.5" height="48.5" rx="12.25" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="25" cy="25" r="18" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="2 3" />

    <g filter="url(#rc-horiz-shadow-dark)" transform="scale(0.78) translate(7, 7)">
      <!-- Plate Base -->
      <path d="M16 42.5C21 46.5 43 46.5 48 42.5C46 44 18 44 16 42.5Z" fill="#FFFFFF" opacity="0.9" />
      <path d="M17 38C22 42.5 42 42.5 47 38C45 40 19 40 17 38Z" fill="#FFFFFF" opacity="0.7" />

      <!-- Flame -->
      <path d="M32 12C32 12 39 19.5 39 27C39 33 34.5 36.5 32 36.5C29.5 36.5 25 33 25 27C25 21.5 29 16.5 32 12Z" fill="url(#rc-horiz-flame-dark)" />
      <!-- Core -->
      <path d="M32 23C33.8 23 35.5 25.2 35.5 28C35.5 30.5 33.8 32.5 32 32.5C30.2 32.5 28.5 30.5 28.5 28C28.5 26.2 30 24.5 32 23Z" fill="url(#rc-horiz-core-dark)" />
      <!-- Sparkle -->
      <path d="M44 16L45.2 18.8L48 20L45.2 21.2L44 24L42.8 21.2L40 20L42.8 18.8L44 16Z" fill="#FFFFFF" opacity="0.95" />
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(66, 12)">
    <!-- Primary Brand Wordmark for Dark Backgrounds -->
    <text x="0" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.03em" fill="#F8FAFC">
      Restaura<tspan fill="url(#rc-text-orange-dark)">Core</tspan>
    </text>

    <!-- Subtitle Tagline -->
    <text x="1" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.16em" fill="#94A3B8" text-transform="uppercase">
      GESTIÓN INTELIGENTE DE RESTAURANTES
    </text>
  </g>
</svg>
